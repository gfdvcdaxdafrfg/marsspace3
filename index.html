<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox Layout</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .flow {
            background-color: #f0f0f0;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }
        
        .navbar-container {
            display: flex;
            background-color: #333;
            color: white;
            padding: 15px;
        }
        
        .navbar {
            display: flex;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .logo {
            margin-right: auto;
            font-weight: bold;
        }
        
        .nav-items {
            display: flex;
            gap: 20px;
            margin-left: 20px;
        }
        
        .section-label {
            padding: 10px;
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: red;
        }
        
        .main-section {
            display: flex;
            flex: 1;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            gap: 40px;
        }
        
        .left, .right {
            flex: 1;
            height: 300px;
            background-color: red;
            color: white;
            font-weight: bold;
            text-align: center;
            font-size: 32px;
            border: 1px dashed darkred;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        footer {
            background-color: #333;
            color: white;
            padding: 15px;
        }
        
        .footer-content {
            display: flex;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .footer-items {
            display: flex;
            gap: 20px;
            margin-left: 20px;
        }
    </style>
</head>
<body>

    <div class="navbar-container">
        <div class="navbar">
            <div class="logo">Logo</div>
            <div class="nav-items">
                <div>navbar</div>
                <div>navbar</div>
                <div>navbar</div>
                <div>navbar</div>
                <div>navbar</div>
            </div>
        </div>
    </div>

    <div class="section-label">1-Section</div>

    <div class="main-section">
        <div class="left">Left</div>
        <div class="right">Right</div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="logo">Logo</div>
            <div class="footer-items">
                <div>footer</div>
                <div>footer</div>
                <div>footer</div>
                <div>footer</div>
            </div>
        </div>
    </footer>
</body>
</html>
